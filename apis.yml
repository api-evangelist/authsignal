apis:
- aid: authsignal:server-api
  name: Authsignal Server API
  description: >-
    Server-to-server REST API used to track user actions, evaluate the rules engine, mint short-lived
    URLs for the pre-built authentication UI, issue client tokens, validate challenge results, and manage
    enrolled authenticators on behalf of users. Authenticated with the tenant secret (HTTP Basic with
    the tenant ID as username).
  humanURL: https://docs.authsignal.com/api-reference/server-api/overview
  baseURL: https://api.authsignal.com
  tags:
  - REST
  - Server
  - Actions
  - Users
  - Authenticators
  properties:
  - type: Documentation
    url: https://docs.authsignal.com/api-reference/server-api/overview
- aid: authsignal:client-api
  name: Authsignal Client API
  description: >-
    Browser / device-facing REST API for fully custom authentication UIs. Supports passkeys, authenticator
    apps, SMS / WhatsApp OTP, email OTP, magic links, and push challenges. Authenticated with short-lived
    client tokens issued by the Server API.
  humanURL: https://docs.authsignal.com/api-reference/client-api/overview
  baseURL: https://api.authsignal.com
  tags:
  - REST
  - Client
  - Passkeys
  - OTP
  properties:
  - type: Documentation
    url: https://docs.authsignal.com/api-reference/client-api/overview
- aid: authsignal:management-api
  name: Authsignal Management API
  description: >-
